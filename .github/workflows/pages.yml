# Publica la versión ESTÁTICA de la app en GitHub Pages.
#
# IMPORTANTE: Pages no ejecuta server.mjs. Esta copia funciona en modo local,
# sin cuentas, sin sincronización y SIN el control USUARIO_UNICO. Los datos
# del propietario nunca se publican (data/ está en .gitignore).
#
# Ajustes previos que solo el dueño puede hacer en la web de GitHub:
#   1. Settings -> General -> Danger zone -> Change repository visibility -> Public
#      (con plan Free, Pages no está disponible en repositorios privados)
#   2. Settings -> Pages -> Build and deployment -> Source -> GitHub Actions
#      (crea el sitio una vez; el GITHUB_TOKEN NO puede crearlo por API)
#
# El build y el deploy van en DOS JOBS con `needs:`: el artefacto de Pages se
# finaliza al terminar el job que lo sube. Si ambas cosas ocurren en el mismo
# job, deploy-pages puede listar 0 artefactos y fallar con
# "No artifacts named github-pages were found for this workflow run".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar
        uses: actions/checkout@v6

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Verificar (56 pruebas)
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Preparar artefacto estático
        run: node tools/preparar-pages.mjs

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5
