# Publica la versión ESTÁTICA de la app en GitHub Pages.
#
# IMPORTANTE: Pages no ejecuta server.mjs. Esta copia funciona en modo local,
# sin cuentas, sin sincronización y SIN el control USUARIO_UNICO. Los datos
# del propietario nunca se publican (data/ está en .gitignore).
#
# Requisitos previos (solo los puede hacer el dueño desde la web de GitHub):
#   1. Settings -> General -> Danger zone -> Change repository visibility -> Public
#      (con plan Free, Pages no está disponible en repositorios privados)
#   2. Settings -> Pages -> Build and deployment -> Source -> GitHub Actions
#      (crea el sitio una vez; el GITHUB_TOKEN NO puede crearlo por API)
# El token de integración de Arena tampoco puede hacer ninguna de las dos cosas:
# la API responde 403 "Resource not accessible by integration".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# El GITHUB_TOKEN puede DESPLEGAR en un sitio de Pages ya existente, pero NO
# puede CREAR el sitio (operación de administración del repositorio).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clonar
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verificar (56 pruebas)
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Preparar artefacto estático
        run: node tools/preparar-pages.mjs

      # Sin `enablement`: ese input solo funciona con un PAT o una GitHub App
      # con administration:write + pages:write. Con GITHUB_TOKEN falla siempre
      # con "Resource not accessible by integration". El sitio debe haberse
      # habilitado una vez en Settings -> Pages -> Source: GitHub Actions.
      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
